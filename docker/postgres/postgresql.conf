# PostgreSQL configuration for ledgerx-backend (local Docker Compose environment).
# Combines TLS enforcement with connection/memory tuning appropriate for a small,
# single-instance dev database. See docker/postgres/pg_hba.conf for auth rules.

# --- Connections -----------------------------------------------------------
listen_addresses = '*'
max_connections = 100

# --- TLS ---------------------------------------------------------------
ssl = on
ssl_cert_file = '/etc/postgresql/certs/server.crt'
ssl_key_file = '/etc/postgresql/certs/server.key'
ssl_min_protocol_version = 'TLSv1.2'
password_encryption = scram-sha-256

# --- Memory ------------------------------------------------------------
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 8MB
maintenance_work_mem = 64MB

# --- Write-ahead log / checkpoints --------------------------------------
wal_buffers = 16MB
min_wal_size = 1GB
max_wal_size = 4GB
checkpoint_completion_target = 0.9

# --- Planner -----------------------------------------------------------
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100

# --- Logging / auditing --------------------------------------------------
log_connections = on
log_disconnections = on
log_min_duration_statement = 200
