# PostgreSQL client authentication for ledgerx-backend.
# Only encrypted (hostssl) connections are accepted; any plaintext attempt is
# rejected outright and password auth always uses SCRAM-SHA-256.

local   all             all                                     scram-sha-256

# Reject any client that does not negotiate TLS.
hostnossl all           all             0.0.0.0/0               reject
hostnossl all           all             ::/0                    reject

# Encrypted connections only, scoped to the application database/user.
hostssl ledgerx         ledgerx         0.0.0.0/0               scram-sha-256
hostssl ledgerx         ledgerx         ::/0                    scram-sha-256
