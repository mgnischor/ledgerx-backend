apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: ledgerx
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: ledgerx-backend
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ledgerx
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: ledgerx-backend
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: ledgerx-backend
    spec:
      automountServiceAccountToken: false
      initContainers:
        # Generates a self-signed cert so the postgres <-> backend link is encrypted.
        # This proves nothing about server identity (sslmode=require on the client
        # side does not validate it) -- swap for a real CA-issued cert + verify-full
        # before running this near production.
        - name: gen-tls-cert
          image: alpine/openssl:latest
          command:
            - sh
            - -c
            - |
              openssl req -new -x509 -days 3650 -nodes \
                -subj "/CN=postgres.ledgerx.svc.cluster.local" \
                -newkey rsa:4096 \
                -keyout /certs/server.key \
                -out /certs/server.crt
              chmod 600 /certs/server.key
              chmod 644 /certs/server.crt
              chown 999:999 /certs/server.key /certs/server.crt
          volumeMounts:
            - name: postgres-certs
              mountPath: /certs
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
              ephemeral-storage: "16Mi"
            limits:
              cpu: "200m"
              memory: "64Mi"
              ephemeral-storage: "32Mi"
      containers:
        - name: postgres
          image: postgres:18
          command:
            - postgres
            - -c
            - config_file=/etc/postgresql/postgresql.conf
            - -c
            - hba_file=/etc/postgresql/pg_hba.conf
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: ledgerx-secrets
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: ledgerx-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ledgerx-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
            - name: postgres-certs
              mountPath: /var/lib/postgresql/certs
              readOnly: true
            - name: postgres-tuning-config
              mountPath: /etc/postgresql
              readOnly: true
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "ledgerx", "-d", "ledgerx"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "ledgerx", "-d", "ledgerx"]
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: postgres-certs
          emptyDir: {}
        - name: postgres-tuning-config
          configMap:
            name: postgres-tuning-config
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ledgerx
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: ledgerx-backend
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
